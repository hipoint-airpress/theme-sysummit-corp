application:
  label: 首页 - 应用领域
  items:
    app1_title:
      name: app1_title
      label: 领域 1 标题
      type: text
      data-type: string
      default: '工业应用'
    app1_desc:
      name: app1_desc
      label: 领域 1 描述
      type: textarea
      data-type: string
      default: '工业自动化正经历着前所未有的技术变革，而芯片作为这一进程中的关键组成部分，其性能和可靠性对整个系统的效能有着决定性影响。六岳微电子推出的芯片产品助力工业生产向更高效、智能的方向发展。'
    app1_image:
      name: app1_image
      label: 领域 1 图片
      type: attachment
      data-type: string
      default: 'https://cdn.newaigou.com/sysummit/assets/image/application/industrial/bg.jpg'
    app1_link:
      name: app1_link
      label: 领域 1 链接
      type: text
      data-type: string
      default: '/s/app-industrial'
    app1_icon:
      name: app1_icon
      label: 领域 1 图标
      type: select
      data-type: string
      default: 'factory'
      options:
        - value: 'factory'
          label: 工业
        - value: 'flash'
          label: 电力
        - value: 'car'
          label: 汽车
        - value: 'device'
          label: 消费
