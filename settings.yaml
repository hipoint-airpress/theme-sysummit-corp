      name: app2_image
      label: 领域 2 图片
      type: attachment
      data-type: string
      default: 'https://cdn.newaigou.com/sysummit/assets/image/application/automotive/bg.jpg'
    app2_link:
      name: app2_link
      label: 领域 2 链接
      type: text
      data-type: string
      default: '/s/app-automotive'
    app2_icon:
      name: app2_icon
      label: 领域 2 图标
      type: select
      data-type: string
      default: 'car'
      options:
        - value: 'factory'
          label: 工业
        - value: 'flash'
          label: 电力
        - value: 'car'
          label: 汽车
        - value: 'device'
          label: 消费
    app3_title:
      name: app3_title
      label: 领域 3 标题
      type: text
      data-type: string
      default: '电力能源'
    app3_desc:
      name: app3_desc
      label: 领域 3 描述
      type: textarea
      data-type: string
      default: '新能源技术正在引领全球能源与环境的可持续发展。六岳微电子推出的工业应用芯片因其高效能、低功耗的特性，并实现了高精度的监控和控制，赋能新能源领域创新。'
