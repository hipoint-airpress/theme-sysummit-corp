basic:
  label: 基础设置
  items:
    company_name:
      name: company_name
      label: 公司名称
      type: text
      data-type: string
      default: '六岳微电子'
    logo:
      name: logo
      label: 站点 Logo
      type: attachment
      data-type: string
      default: 'https://cdn.newaigou.com/sysummit/assets/image/logo.png'
    logo_text:
      name: logo_text
      label: 站点名称（文字 Logo）
      type: text
      data-type: string
      default: '六岳微电子'
      description: 未上传 Logo 图片时显示
    primary_color:
      name: primary_color
      label: 主题色
      type: text
      data-type: string
      default: '#409eff'
      placeholder: '#409eff'
    news_url:
      name: news_url
      label: 「新闻」链接
      type: text
      data-type: string
      default: '/archives'
    login_url:
      name: login_url
      label: 「登录」链接
      type: text
      data-type: string
      default: '/admin'
      description: 顶部条右侧登录入口，留空则不显示
    contact_phones:
      name: contact_phones
      label: 联系电话（可多条）
      type: textarea
      data-type: string
      default: |
        [
          {"label": "市场电话", "value": "181-6371-7051", "tel": "18163717051"},
          {"label": "技术支持", "value": "181-6371-7051", "tel": "18163717051"}
        ]
      description: 'JSON 数组，每项 {"label":"名称","value":"展示号码","tel":"拨号号码（省略则用 value）"}；留空则联系区块与页脚不显示电话，格式非法时同样按空处理'
    contact_emails:
      name: contact_emails
      label: 联系邮箱（可多条）
      type: textarea
      data-type: string
      default: |
        [
          {"label": "销售", "value": "sale@sysummit.com"},
          {"label": "技术支持", "value": "support@sysummit.com"}
        ]
      description: 'JSON 数组，每项 {"label":"名称（可省略）","value":"邮箱"}；第一条同时作为留言表单的收件邮箱，留空则联系区块与页脚不显示邮箱'
    contact_address:
      name: contact_address
      label: 公司地址
      type: textarea
      data-type: string
      default: '湖南省长沙市开福区金辉商务中心3楼'
    contact_url:
      name: contact_url
      label: 「联系我们」按钮链接
      type: text
      data-type: string
      default: '/s/contact'
    beian_no:
      name: beian_no
      label: 公安备案号
      type: text
      data-type: string
      default: '湘公网安备43010502001925号-1'
      description: 页脚版权区展示，留空则不显示
    beian_code:
      name: beian_code
      label: 公安备案链接代码
      type: text
      data-type: string
      default: '43010502001925'
      description: 公安备案链接 recordcode 参数，与公安备案号对应
    icp:
      name: icp
      label: ICP 备案号
      type: text
      data-type: string
      default: '湘ICP备2025147673号-1'
    copyright:
      name: copyright
      label: 版权信息
      type: textarea
      data-type: string
      default: '©2025 六岳微电子 All rights reserved.'
